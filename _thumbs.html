<!DOCTYPE html>
<html><head><title>running</title><script src="build-tables.js"></script></head>
<body style="margin:0">
<textarea id="out"></textarea>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const engine = docsEngineBaseURL + "MDogModules/MDogMain.js";
const results = {};

async function pageCode(page) {
    const html = await (await fetch(page)).text();
    return new DOMParser().parseFromString(html, "text/html").querySelector("#example-code").textContent;
}

async function codeFor(id) {
    if (id === "square") {
        const js = await (await fetch("playground.js")).text();
        return js.match(/const defaultCode = `([\s\S]*?)`;/)[1].replace("${engineImport}", `import MDog from "${engine}";`);
    }
    if (id === "warrior") {
        const html = await (await fetch("tutorial.html")).text();
        const code = [...html.matchAll(/code: `([\s\S]*?)`,/g)][5][1];
        return `import MDog from "${engine}";\nMDog.Draw.setScreenSize(256, 192);\n${docsDedent(code)}`;
    }
    return pageCode("example-" + id + ".html");
}

async function shoot(id, actions) {
    const frame = document.createElement("iframe");
    frame.style.cssText = "width:800px;height:600px;border:0";
    const code = await codeFor(id);
    frame.srcdoc = `<!DOCTYPE html><html><head><script>window.requestAnimationFrame = f => setTimeout(() => f(performance.now()), 16);<\/script>
<style>html,body{margin:0;height:100%;background:#000}</style></head><body><script type="module">${code.replace(/<\/script/g, "<\\/script")}<\/script></body></html>`;
    document.body.appendChild(frame);
    await sleep(2500);
    const w = frame.contentWindow, d = w.document;
    await actions(w, d);
    const canvases = [...d.querySelectorAll("canvas")];
    const out = document.createElement("canvas");
    out.width = canvases[0].width;
    out.height = canvases[0].height;
    const ctx = out.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, out.width, out.height);
    for (const c of canvases) ctx.drawImage(c, 0, 0);
    results[id] = out.toDataURL("image/png");
    frame.remove();
}

const key = (w, k, down) => w.dispatchEvent(new w.KeyboardEvent(down ? "keydown" : "keyup", {key: k, code: k === " " ? "Space" : k, bubbles: true}));
const mouse = (w, d, type, x, y) => {
    const c = d.querySelector("canvas").getBoundingClientRect();
    const opts = {clientX: c.left + x * c.width, clientY: c.top + y * c.height, bubbles: true, button: 0, buttons: type === "mouseup" ? 0 : 1};
    for (const t of [w, d, d.querySelector("canvas")]) t.dispatchEvent(new w.MouseEvent(type, opts));
};

(async () => {
    await shoot("square", async () => {});
    await shoot("warrior", async w => {
        key(w, " ", true); await sleep(100); key(w, " ", false);
        key(w, "ArrowRight", true); await sleep(900); key(w, "ArrowUp", true); await sleep(80); key(w, "ArrowUp", false);
        await sleep(250); key(w, "ArrowRight", false);
    });
    await shoot("platformer", async w => {
        key(w, "ArrowRight", true); await sleep(700); key(w, "ArrowUp", true); await sleep(80); key(w, "ArrowUp", false); await sleep(200); key(w, "ArrowRight", false);
    });
    await shoot("particles", async (w, d) => {
        for (const [x, y] of [[0.3, 0.45], [0.68, 0.4], [0.5, 0.6]]) {
            mouse(w, d, "mousemove", x, y); mouse(w, d, "mousedown", x, y); await sleep(60); mouse(w, d, "mouseup", x, y); await sleep(250);
        }
        await sleep(20);
    });
    await shoot("title-screen", async () => {});
    await shoot("road", async () => {});
    document.getElementById("out").textContent = JSON.stringify(results);
    document.title = "done " + Object.keys(results).join(",");
})().catch(e => document.title = "ERR " + e.message);
</script>
</body></html>
